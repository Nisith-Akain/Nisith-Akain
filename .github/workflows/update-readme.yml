name: Update README
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "NisithAkain"
          git config user.email "248806978+Nisith-Akain@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update featured repos and recent commits"
          git push
