<g class="tap1"><rect x="82" y="48" width="3" height="2" fill="#f1c27d"/></g>

<!-- ================= NIGHT DIMMER ================= -->
<rect class="a cy dim" width="128" height="72" fill="#070b2a"/>

<!-- ================= WINDOW CONTENTS (undimmed sky) ================= -->
<rect class="a cy sky" x="10" y="8" width="52" height="34"/>
<g clip-path="url(#win)">
  <g class="a cy stars" fill="#fff">
    <rect class="tw" x="16" y="12" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-.5s" x="24" y="18" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-1s" x="31" y="11" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-.2s" x="41" y="16" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-1.3s" x="47" y="12" width="2" height="1"/>
    <rect class="tw" style="animation-delay:-.8s" x="55" y="20" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-.3s" x="13" y="25" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-1.1s" x="38" y="28" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-.6s" x="58" y="13" width="1" height="1"/>
    <rect class="tw" style="animation-delay:-.9s" x="28" y="30" width="1" height="1"/>
  </g>
  <g class="a cy shoot"><rect x="50" y="12" width="3" height="1" fill="#fff"/></g>

  <g transform="translate(10 8)"><g class="a cy sunx"><g class="a cy suny"><g class="a cy suncol">
    <rect x="1" y="0" width="4" height="1"/><rect x="0" y="1" width="6" height="4"/><rect x="1" y="5" width="4" height="1"/>
  </g></g></g></g>

  <g transform="translate(10 8)"><g class="a cy moonx"><g class="a cy moony">
    <rect x="1" y="0" width="4" height="1" fill="#f4f1d0"/><rect x="0" y="1" width="6" height="4" fill="#f4f1d0"/><rect x="1" y="5" width="4" height="1" fill="#f4f1d0"/>
    <rect x="3" y="1" width="1" height="1" fill="#d6d2a8"/><rect x="1" y="3" width="2" height="1" fill="#d6d2a8"/><rect x="4" y="4" width="1" height="1" fill="#d6d2a8"/>
  </g></g></g>

  <g class="a cy cloudfill"><g class="drift" transform="translate(10 12)"><use href="#cloud"/></g></g>
  <g class="a cy cloudfill"><g class="drift" style="animation-delay:-18s" transform="translate(10 21)"><use href="#cloud" transform="scale(.7)"/></g></g>

  <g class="a cy hillb"><rect x="10" y="35" width="52" height="7"/><rect x="30" y="33" width="14" height="2"/><rect x="34" y="31" width="6" height="2"/></g>
  <g class="a cy hillf"><rect x="10" y="38" width="52" height="4"/><rect x="12" y="36" width="12" height="2"/><rect x="16" y="35" width="5" height="1"/><rect x="46" y="36" width="14" height="2"/></g>
</g>
<rect class="a cy bar" x="35" y="8" width="2" height="34"/>
<rect class="a cy bar" x="10" y="24" width="52" height="2"/>

