<g class="tap2"><rect x="86" y="48" width="3" height="2" fill="#d9a56a"/></g>

<!-- head -->
<g class="nod">
  <rect x="70" y="34" width="8" height="8" fill="#f1c27d"/>
  <rect x="78" y="38" width="1" height="1" fill="#f1c27d"/>
  <rect x="69" y="32" width="9" height="3" fill="#3a2a1f"/>
  <rect x="69" y="35" width="3" height="4" fill="#3a2a1f"/>
