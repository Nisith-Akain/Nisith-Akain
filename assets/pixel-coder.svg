<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 72" width="1024" height="576" shape-rendering="crispEdges" role="img" aria-label="A pixel-art coder typing at a desk while day and night cycle outside the window">
<title>Pixel coder at work, day and night cycling</title>
<style>
  .a{animation-iteration-count:infinite;animation-timing-function:linear}
  .cy{animation-duration:24s}

  /* ---------- day / night cycle (24s loop) ---------- */
  @keyframes sky{0%{fill:#f6a97a}10%{fill:#7ec8ff}40%{fill:#5db4f5}50%{fill:#f08a5d}58%{fill:#4a2f6b}66%{fill:#0b1030}92%{fill:#0b1030}100%{fill:#f6a97a}}
  .sky{animation-name:sky}

  @keyframes sunx{0%{transform:translateX(0)}50%,100%{transform:translateX(46px)}}
  @keyframes suny{0%{transform:translateY(30px)}8%{transform:translateY(16px)}16%{transform:translateY(8px)}25%{transform:translateY(3px)}34%{transform:translateY(8px)}42%{transform:translateY(16px)}50%,100%{transform:translateY(30px)}}
  @keyframes suncol{0%{fill:#ff8a3d}10%{fill:#ffd84a}40%{fill:#ffe45e}50%,100%{fill:#ff6a3d}}
  .sunx{animation-name:sunx}.suny{animation-name:suny}.suncol{animation-name:suncol}

  @keyframes moonx{0%,54%{transform:translateX(0)}100%{transform:translateX(46px)}}
  @keyframes moony{0%,54%{transform:translateY(30px)}62%{transform:translateY(16px)}70%{transform:translateY(8px)}77%{transform:translateY(3px)}84%{transform:translateY(8px)}92%{transform:translateY(16px)}100%{transform:translateY(30px)}}
  .moonx{animation-name:moonx}.moony{animation-name:moony}

  @keyframes stars{0%,52%{opacity:0}62%,88%{opacity:1}98%,100%{opacity:0}}
  .stars{animation-name:stars}
  @keyframes tw{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
  .tw{animation:tw 1.6s steps(1,end) infinite}
  @keyframes shoot{0%,70%{transform:translate(0,0);opacity:0}71%{opacity:1}75%{transform:translate(-14px,7px);opacity:0}100%{transform:translate(-14px,7px);opacity:0}}
  .shoot{animation-name:shoot}

  @keyframes cloudfill{0%{fill:#ffd9c2;opacity:.9}10%{fill:#fff;opacity:1}40%{fill:#fff;opacity:1}50%{fill:#ffb48a;opacity:.9}60%{fill:#5a4a85;opacity:.5}70%,92%{fill:#2a2f5c;opacity:.35}100%{fill:#ffd9c2;opacity:.9}}
  .cloudfill{animation-name:cloudfill}
  @keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(64px)}}
  .drift{animation:drift 36s linear infinite}

  @keyframes hillb{0%{fill:#6f9a6a}10%{fill:#5fbf6a}40%{fill:#58b362}50%{fill:#8a7a58}60%{fill:#26305a}70%,92%{fill:#141a38}100%{fill:#6f9a6a}}
  @keyframes hillf{0%{fill:#4f7d56}10%{fill:#3f9b4a}40%{fill:#3a9246}50%{fill:#5e5a45}60%{fill:#1a2245}70%,92%{fill:#0d1228}100%{fill:#4f7d56}}
  .hillb{animation-name:hillb}.hillf{animation-name:hillf}

  @keyframes bar{0%{fill:#c9b89a}10%,40%{fill:#e8dcc4}50%{fill:#b79c7c}60%{fill:#3a3556}70%,92%{fill:#242a48}100%{fill:#c9b89a}}
  .bar{animation-name:bar}

  @keyframes dim{0%{opacity:.18}10%,42%{opacity:0}52%{opacity:.3}62%,90%{opacity:.58}100%{opacity:.18}}
  .dim{animation-name:dim}
  @keyframes lampon{0%{opacity:.2}8%,46%{opacity:0}56%,92%{opacity:1}100%{opacity:.2}}
  .lampon{animation-name:lampon}

  /* ---------- the coder ---------- */
  @keyframes tap{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
  .tap1{animation:tap .5s step-end infinite}
  .tap2{animation:tap .5s step-end infinite;animation-delay:-.25s}
  @keyframes nod{0%{transform:translateY(0)}50%{transform:translateY(1px)}}
  .nod{animation:nod 1.6s step-end infinite}
  @keyframes blink{0%{opacity:1}95%{opacity:0}98%{opacity:1}}
  .blink{animation:blink 4s step-end infinite}
  @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-10px)}}
  .scroll{animation:scroll 2.5s steps(5,end) infinite}
  @keyframes cursor{0%{opacity:1}50%{opacity:0}}
  .cursor{animation:cursor 1s step-end infinite}
  @keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-4px);opacity:0}}
  .steam{animation:steam 2s steps(4,end) infinite}
  @keyframes tail{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
  .tail{animation:tail .9s step-end infinite}
</style>

<defs>
  <clipPath id="win"><rect x="10" y="8" width="52" height="34"/></clipPath>
  <clipPath id="code"><rect x="94" y="34" width="24" height="10"/></clipPath>
  <g id="cloud"><rect x="4" y="0" width="5" height="1"/><rect x="2" y="1" width="10" height="1"/><rect x="0" y="2" width="14" height="2"/></g>
  <g id="lines">
    <rect x="96" y="35" width="3" height="1" fill="#ff79c6"/><rect x="100" y="35" width="6" height="1" fill="#8be9fd"/><rect x="107" y="35" width="5" height="1" fill="#e6edf3"/>
    <rect x="98" y="37" width="5" height="1" fill="#50fa7b"/><rect x="104" y="37" width="9" height="1" fill="#f1fa8c"/>
    <rect x="98" y="39" width="2" height="1" fill="#bd93f9"/><rect x="101" y="39" width="4" height="1" fill="#e6edf3"/><rect x="106" y="39" width="7" height="1" fill="#f1fa8c"/>
    <rect x="100" y="41" width="12" height="1" fill="#6272a4"/>
    <rect x="100" y="43" width="4" height="1" fill="#ff79c6"/><rect x="105" y="43" width="6" height="1" fill="#8be9fd"/><rect x="112" y="43" width="2" height="1" fill="#e6edf3"/>
  </g>
</defs>

