  <rect x="70" y="31" width="7" height="1" fill="#30363d"/><rect x="69" y="32" width="1" height="4" fill="#30363d"/>
  <rect x="69" y="36" width="4" height="4" fill="#30363d"/><rect x="70" y="37" width="1" height="2" fill="#3fb950"/>
</g>

