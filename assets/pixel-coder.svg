<rect x="38" y="60" width="9" height="4" fill="#d9822b"/>
<rect x="40" y="60" width="1" height="2" fill="#b9691c"/><rect x="43" y="60" width="1" height="2" fill="#b9691c"/>
<rect x="39" y="64" width="2" height="1" fill="#b9691c"/><rect x="44" y="64" width="2" height="1" fill="#b9691c"/>
<rect x="46" y="58" width="5" height="4" fill="#d9822b"/>
<rect x="46" y="57" width="1" height="1" fill="#d9822b"/><rect x="50" y="57" width="1" height="1" fill="#d9822b"/>
