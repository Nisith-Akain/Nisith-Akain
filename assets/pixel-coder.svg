<!-- floor plant -->
<rect x="25" y="49" width="2" height="10" fill="#2d7a3a"/><rect x="23" y="52" width="2" height="3" fill="#3f9b4a"/>
<rect x="27" y="53" width="3" height="3" fill="#3f9b4a"/><rect x="21" y="55" width="3" height="2" fill="#2d7a3a"/>
